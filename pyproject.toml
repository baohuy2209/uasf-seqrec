[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uasf-seqrec"
version = "0.1.0"
description = "User-Adaptive Side-Information Fusion for Sequential Recommendation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scipy",
    "scikit-learn",
    "PyYAML",
    "psutil",
    "sentence-transformers>=3,<6",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
analysis = ["matplotlib", "reportlab", "pypdf"]
test = [
    "pytest",
]
parquet = [
    "pyarrow",
]
dev = [
    "pytest",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["taimma*", "metadata_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
