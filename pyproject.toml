[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uasf-seqrec"
version = "1.0.0"
description = "Controlled study of item metadata and utility-supervised fusion in sequential recommendation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Bao-Huy Nguyen"},
    {name = "Quang-Minh Van Nguyen"},
    {name = "Truong-Giang Ngoc Nguyen"},
    {name = "Phuc Nguyen"},
]
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scipy",
    "scikit-learn",
    "PyYAML",
    "psutil",
    "sentence-transformers>=3,<6",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
analysis = ["matplotlib", "reportlab", "pypdf"]
test = [
    "pytest",
]
parquet = [
    "pyarrow",
]
dev = [
    "pytest",
    "pyarrow",
]

[project.urls]
Repository = "https://github.com/baohuy2209/uasf-seqrec"
Issues = "https://github.com/baohuy2209/uasf-seqrec/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["taimma*", "metadata_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
