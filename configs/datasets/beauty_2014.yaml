# Dataset Configuration: Amazon Beauty 2014
dataset_name: "Beauty_2014"
raw_data_dir: "data/raw"
category_subdir: "Beauty"

# Canonical raw data files on disk
reviews_file: "Beauty_5.json"            # 5-core interaction sequences (JSON Lines, 198,502 records)
ratings_file: "ratings_Beauty.csv"        # Full unpruned ratings dump (CSV, 2,023,070 records)
